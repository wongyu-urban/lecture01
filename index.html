<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="공학 시험을 위한 숫자 단위 변환기" />
    <title>공학 단위 변환기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header"><a class="brand" href="/">ENGINEERING TOOLKIT</a><span>LECTURE 01</span></header>
      <section class="converter" aria-labelledby="page-title">
        <p class="eyebrow">UNIT CONVERTER · EXAM EDITION</p>
        <h1 id="page-title"><em>단위변환기</em></h1>
        <p class="intro">길이, 질량, 온도, 압력 단위를 빠르게 변환하세요.</p>
        <form id="converter-form" novalidate>
          <div class="category-buttons" role="group" aria-label="변환 종류">
            <button class="category active" type="button" data-category="length">길이</button>
            <button class="category" type="button" data-category="mass">질량</button>
            <button class="category" type="button" data-category="temperature">온도</button>
            <button class="category" type="button" data-category="pressure">압력</button>
          </div>
          <div class="calculator-panel">
            <div class="display-wrap"><label for="value-input">INPUT</label><input id="value-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0" /></div>
            <div class="fields">
            <label>변환 전<select id="from-unit" aria-label="변환 전 단위"></select></label>
            <button id="swap-button" class="swap" type="button" aria-label="단위 교체">⇄</button>
            <label>변환 후<select id="to-unit" aria-label="변환 후 단위"></select></label>
            </div>
            <div class="keypad" aria-label="숫자 키패드">
              <button type="button" class="key key--clear" data-key="clear">AC</button><button type="button" class="key" data-key="backspace">⌫</button><button type="button" class="key" data-key="-">±</button>
              <button type="button" class="key" data-key="7">7</button><button type="button" class="key" data-key="8">8</button><button type="button" class="key" data-key="9">9</button>
              <button type="button" class="key" data-key="4">4</button><button type="button" class="key" data-key="5">5</button><button type="button" class="key" data-key="6">6</button>
              <button type="button" class="key" data-key="1">1</button><button type="button" class="key" data-key="2">2</button><button type="button" class="key" data-key="3">3</button>
              <button type="button" class="key key--zero" data-key="0">0</button><button type="button" class="key" data-key=".">.</button><button class="key key--equals" type="submit">=</button>
            </div>
          </div>
        </form>
        <section id="result" class="result result--idle" aria-live="polite"><p class="result-label">READY</p><p class="result-value">값과 단위를 선택해 주세요.</p><p class="result-formula">공학 시험용 단위 변환 도구</p></section>
      </section>
      <aside class="note"><p>QUICK TIP</p><p>결과를 확인한 뒤<br />유효숫자를 한 번 더 점검하세요.</p></aside>
    </main>
    <script src="script.js"></script>
  </body>
</html>
